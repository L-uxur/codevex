<!DOCTYPE html>
<html lang="tk">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>AÝDYMLY</title>

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

body{
    font-family:Arial,Helvetica,sans-serif;
    background:#06101d;
    color:#fff;
    min-height:100vh;
}

/* HEADER */

header{
    height:70px;
    background:#0a1727;
    border-bottom:1px solid #20364d;
    display:flex;
    align-items:center;
    gap:25px;
    padding:0 25px;
    position:sticky;
    top:0;
    z-index:50;
}

.logo{
    font-size:25px;
    font-weight:bold;
    color:#36e5cf;
    white-space:nowrap;
}

.searchBox{
    flex:1;
    max-width:600px;
    position:relative;
}

.searchBox input{
    width:100%;
    background:#101f31;
    border:1px solid #29445c;
    color:white;
    outline:none;
    border-radius:25px;
    padding:13px 20px 13px 45px;
    font-size:14px;
}

.searchIcon{
    position:absolute;
    left:17px;
    top:12px;
    color:#8da5ba;
}

/* MAIN */

main{
    padding:25px;
    padding-bottom:150px;
}

.hero{
    min-height:230px;
    border-radius:22px;
    padding:35px;
    display:flex;
    flex-direction:column;
    justify-content:center;
    background:
        radial-gradient(circle at 80% 20%,#18546b55,transparent 35%),
        linear-gradient(135deg,#0d2943,#102d45,#092033);
    border:1px solid #21415c;
    margin-bottom:30px;
}

.hero h1{
    font-size:40px;
    margin-bottom:12px;
}

.hero p{
    color:#9db3c6;
    font-size:16px;
}

/* GENRES */

.sectionTitle{
    font-size:22px;
    margin-bottom:15px;
}

.genres{
    display:flex;
    gap:10px;
    overflow-x:auto;
    padding-bottom:10px;
    margin-bottom:30px;
}

.genres::-webkit-scrollbar{
    height:4px;
}

.genre{
    background:#0d2034;
    border:1px solid #24425c;
    color:#b8cada;
    padding:10px 18px;
    border-radius:25px;
    white-space:nowrap;
    cursor:pointer;
    transition:.2s;
}

.genre:hover,
.genre.active{
    background:#36e5cf;
    color:#06101d;
    border-color:#36e5cf;
}

/* SONGS */

.songGrid{
    display:grid;
    grid-template-columns:
        repeat(auto-fill,minmax(180px,1fr));
    gap:20px;
}

.songCard{
    background:#0b1a2b;
    border:1px solid #1d354b;
    border-radius:17px;
    padding:12px;
    cursor:pointer;
    transition:.25s;
    position:relative;
}

.songCard:hover{
    transform:translateY(-5px);
    border-color:#36e5cf;
    box-shadow:0 10px 30px #0007;
}

.coverBox{
    width:100%;
    aspect-ratio:1/1;
    border-radius:13px;
    overflow:hidden;
    background:#14283b;
    position:relative;
}

.coverBox img{
    width:100%;
    height:100%;
    object-fit:cover;
}

.cardPlay{
    position:absolute;
    right:10px;
    bottom:10px;
    width:45px;
    height:45px;
    border-radius:50%;
    border:none;
    background:#36e5cf;
    color:#06101d;
    font-size:18px;
    cursor:pointer;
    opacity:0;
    transform:translateY(5px);
    transition:.2s;
}

.songCard:hover .cardPlay{
    opacity:1;
    transform:translateY(0);
}

.songTitle{
    margin-top:12px;
    font-size:16px;
    font-weight:bold;
    white-space:nowrap;
    overflow:hidden;
    text-overflow:ellipsis;
}

.songArtist{
    margin-top:6px;
    color:#8fa7bb;
    font-size:13px;
    white-space:nowrap;
    overflow:hidden;
    text-overflow:ellipsis;
}

.empty{
    color:#8fa7bb;
    padding:30px 0;
}

/* PLAYER */

.player{
    position:fixed;
    left:0;
    right:0;
    bottom:0;
    height:95px;
    background:#091725ee;
    backdrop-filter:blur(15px);
    border-top:1px solid #29445d;
    display:flex;
    align-items:center;
    gap:15px;
    padding:10px 20px;
    z-index:100;
}

.playerCover{
    width:65px;
    height:65px;
    border-radius:10px;
    object-fit:cover;
    background:#14283b;
}

.playerInfo{
    width:190px;
    min-width:120px;
}

.playerTitle{
    font-weight:bold;
    white-space:nowrap;
    overflow:hidden;
    text-overflow:ellipsis;
}

.playerArtist{
    color:#8fa7bb;
    font-size:13px;
    margin-top:5px;
    white-space:nowrap;
    overflow:hidden;
    text-overflow:ellipsis;
}

.playerControls{
    display:flex;
    align-items:center;
    gap:10px;
}

.control{
    width:40px;
    height:40px;
    border:none;
    border-radius:50%;
    background:#12273b;
    color:white;
    cursor:pointer;
    font-size:16px;
}

.control:hover{
    background:#1d3a53;
}

.mainPlay{
    background:#36e5cf;
    color:#06101d;
    font-size:18px;
}

.progressArea{
    flex:1;
    display:flex;
    align-items:center;
    gap:10px;
}

.progress{
    width:100%;
    accent-color:#36e5cf;
    cursor:pointer;
}

.time{
    color:#8fa7bb;
    font-size:12px;
    white-space:nowrap;
}

.volumeArea{
    display:flex;
    align-items:center;
    gap:7px;
}

.volume{
    width:90px;
    accent-color:#36e5cf;
}

/* MOBILE */

@media(max-width:700px){

    header{
        height:65px;
        padding:0 12px;
        gap:12px;
    }

    .logo{
        font-size:20px;
    }

    .searchBox{
        max-width:none;
    }

    main{
        padding:15px;
        padding-bottom:145px;
    }

    .hero{
        min-height:190px;
        padding:25px;
    }

    .hero h1{
        font-size:28px;
    }

    .hero p{
        font-size:14px;
    }

    .songGrid{
        grid-template-columns:repeat(2,1fr);
        gap:12px;
    }

    .songCard{
        padding:9px;
    }

    .cardPlay{
        opacity:1;
        transform:none;
        width:38px;
        height:38px;
    }

    .player{
        height:105px;
        padding:8px 10px;
        gap:8px;
        flex-wrap:wrap;
    }

    .playerCover{
        width:48px;
        height:48px;
    }

    .playerInfo{
        width:100px;
        min-width:80px;
    }

    .playerControls{
        gap:4px;
    }

    .control{
        width:36px;
        height:36px;
    }

    .progressArea{
        position:absolute;
        left:10px;
        right:10px;
        bottom:4px;
    }

    .volumeArea{
        display:none;
    }

    .time{
        font-size:10px;
    }
}
</style>
</head>


<body>

<header>

    <div class="logo">
        AÝDYMLY
    </div>

    <div class="searchBox">

        <span class="searchIcon">🔎</span>

        <input
            id="searchInput"
            type="text"
            placeholder="Aýdym ýa-da aýdymçy gözle..."
        >

    </div>

</header>


<main>

    <section class="hero">

        <h1>Aýdymyňy saýla 🎵</h1>

        <p>
            Halaýan aýdymlaryňy gözle, saýla we göni Aýdymly-da diňle.
        </p>

    </section>


    <h2 class="sectionTitle">
        Žanrlar
    </h2>


    <div class="genres">

        <button
            class="genre active"
            onclick="filterGenre('all',this)">
            Hemmesi
        </button>

        <button
            class="genre"
            onclick="filterGenre('pop',this)">
            Pop
        </button>

        <button
            class="genre"
            onclick="filterGenre('rap',this)">
            Rap
        </button>

        <button
            class="genre"
            onclick="filterGenre('phonk',this)">
            Phonk
        </button>

        <button
            class="genre"
            onclick="filterGenre('funk',this)">
            Funk
        </button>

        <button
            class="genre"
            onclick="filterGenre('turkmen',this)">
            Türkmen
        </button>

    </div>


    <h2 class="sectionTitle">
        Aýdymlar
    </h2>


    <div
        id="songGrid"
        class="songGrid">

        <div class="empty">
            Aýdymlar ýüklenýär...
        </div>

    </div>

</main>


<!-- PLAYER -->

<div class="player">

    <img
        id="playerCover"
        class="playerCover"
        src=""
        alt="Cover"
    >


    <div class="playerInfo">

        <div
            id="playerTitle"
            class="playerTitle">
            Aýdym saýla
        </div>

        <div
            id="playerArtist"
            class="playerArtist">
            —
        </div>

    </div>


    <div class="playerControls">

        <button
            class="control"
            onclick="previousSong()">
            ⏮
        </button>

        <button
            id="playButton"
            class="control mainPlay"
            onclick="togglePlay()">
            ▶
        </button>

        <button
            class="control"
            onclick="nextSong()">
            ⏭
        </button>

    </div>


    <div class="progressArea">

        <span
            id="currentTime"
            class="time">
            0:00
        </span>

        <input
            id="progress"
            class="progress"
            type="range"
            min="0"
            max="100"
            value="0"
            step="0.1"
            oninput="seekSong()"
        >

        <span
            id="duration"
            class="time">
            0:00
        </span>

    </div>


    <div class="volumeArea">

        <button
            id="muteButton"
            class="control"
            onclick="toggleMute()">
            🔊
        </button>

        <input
            id="volume"
            class="volume"
            type="range"
            min="0"
            max="1"
            step="0.01"
            value="1"
            oninput="changeVolume()"
        >

    </div>

</div>


<audio
    id="audio"
    preload="metadata">
</audio>


<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>


<script>

/* =========================
   SUPABASE
========================= */

const SUPABASE_URL =
"https://ievywgyevceodiwgymce.supabase.co";

const SUPABASE_KEY =
"sb_publishable_1OBoq4TVdWJI040pwEaY_Q_MzMHMda0";

const db =
supabase.createClient(
    SUPABASE_URL,
    SUPABASE_KEY
);


/* =========================
   ELEMENTS
========================= */

const audio =
document.getElementById("audio");

const songGrid =
document.getElementById("songGrid");

const searchInput =
document.getElementById("searchInput");

const playerCover =
document.getElementById("playerCover");

const playerTitle =
document.getElementById("playerTitle");

const playerArtist =
document.getElementById("playerArtist");

const playButton =
document.getElementById("playButton");

const progress =
document.getElementById("progress");

const currentTime =
document.getElementById("currentTime");

const duration =
document.getElementById("duration");

const volume =
document.getElementById("volume");

const muteButton =
document.getElementById("muteButton");


/* =========================
   VARIABLES
========================= */

let songs = [];

let filteredSongs = [];

let currentIndex = -1;

let currentGenre = "all";

let oldVolume = 1;


/* =========================
   LOAD SONGS
========================= */

async function loadSongs(){

    try{

        const result =
        await db
        .from("Songs")
        .select("*")
        .order("id",{ascending:true});


        if(result.error){

            console.error(result.error);

            songGrid.innerHTML =
            `
            <div class="empty">
                Aýdymlary ýüklemekde ýalňyşlyk boldy.
            </div>
            `;

            return;
        }


        songs =
        result.data || [];

        filteredSongs =
        [...songs];

        renderSongs();

    }
    catch(error){

        console.error(error);

        songGrid.innerHTML =
        `
        <div class="empty">
            Baglanyşyk ýalňyşlygy.
        </div>
        `;

    }

}


/* =========================
   GET COLUMN
========================= */

function getTitle(song){

    return (
        song.title ||
        song.başlık ||
        "Näbelli aýdym"
    );

}


function getArtist(song){

    return (
        song.artist ||
        song.sanatçı ||
        "Näbelli aýdymçy"
    );

}


function getAudio(song){

    return (
        song.ses_url ||
        song.audio_url ||
        ""
    );

}


function getCover(song){

    return (
        song.kapak_url ||
        song.cover_url ||
        ""
    );

}


function getGenre(song){

    return (
        song.genre ||
        song.žanr ||
        ""
    ).toString().toLowerCase();

}


/* =========================
   RENDER SONGS
========================= */

function renderSongs(){

    if(filteredSongs.length === 0){

        songGrid.innerHTML =
        `
        <div class="empty">
            Aýdym tapylmady.
        </div>
        `;

        return;
    }


    songGrid.innerHTML = "";


    filteredSongs.forEach(song=>{

        const realIndex =
        songs.indexOf(song);

        const title =
        getTitle(song);

        const artist =
        getArtist(song);

        const cover =
        getCover(song);


        const card =
        document.createElement("div");

        card.className =
        "songCard";


        const coverBox =
        document.createElement("div");

        coverBox.className =
        "coverBox";


        if(cover){

            const img =
            document.createElement("img");

            img.src = cover;

            img.alt = title;

            coverBox.appendChild(img);

        }


        const button =
        document.createElement("button");

        button.className =
        "cardPlay";

        button.textContent =
        "▶";


        button.onclick =
        function(event){

            event.stopPropagation();

            selectSong(realIndex);

        };


        coverBox.appendChild(button);


        const titleElement =
        document.createElement("div");

        titleElement.className =
        "songTitle";

        titleElement.textContent =
        title;


        const artistElement =
        document.createElement("div");

        artistElement.className =
        "songArtist";

        artistElement.textContent =
        artist;


        card.appendChild(coverBox);

        card.appendChild(titleElement);

        card.appendChild(artistElement);


        card.onclick =
        function(){

            selectSong(realIndex);

        };


        songGrid.appendChild(card);

    });

}


/* =========================
   SELECT SONG
========================= */

function selectSong(index){

    if(!songs[index]){
        return;
    }


    currentIndex =
    index;


    const song =
    songs[index];


    const title =
    getTitle(song);

    const artist =
    getArtist(song);

    const audioURL =
    getAudio(song);

    const coverURL =
    getCover(song);


    playerTitle.textContent =
    title;

    playerArtist.textContent =
    artist;


    if(coverURL){

        playerCover.src =
        coverURL;

    }
    else{

        playerCover.removeAttribute("src");

    }


    if(!audioURL){

        alert(
            "Bu aýdymyň ses URL-si ýok."
        );

        return;
    }


    /*
       Täze aýdym saýlananda
       öňki aýdymyň ýerine täze MP3 goýulýar.
    */

    audio.pause();

    audio.src =
    audioURL;

    audio.load();


    /*
       Useriň basmagy bilen
       play() edilýär.
    */

    const playPromise =
    audio.play();


    if(playPromise !== undefined){

        playPromise
        .then(()=>{

            playButton.textContent =
            "⏸";

        })
        .catch(error=>{

            console.log(
                "Play error:",
                error
            );

            playButton.textContent =
            "▶";

        });

    }

}


/* =========================
   PLAY / PAUSE
========================= */

function togglePlay(){

    if(!audio.src){

        if(songs.length > 0){

            selectSong(0);

        }

        return;
    }


    if(audio.paused){

        audio.play()
        .then(()=>{

            playButton.textContent =
            "⏸";

        })
        .catch(error=>{

            console.log(error);

        });

    }
    else{

        audio.pause();

        playButton.textContent =
        "▶";

    }

}


/* =========================
   NEXT
========================= */

function nextSong(){

    if(songs.length === 0){
        return;
    }


    let next =
    currentIndex + 1;


    if(next >= songs.length){

        next = 0;

    }


    selectSong(next);

}


/* =========================
   PREVIOUS
========================= */

function previousSong(){

    if(songs.length === 0){
        return;
    }


    let previous =
    currentIndex - 1;


    if(previous < 0){

        previous =
        songs.length - 1;

    }


    selectSong(previous);

}


/* =========================
   AUTO NEXT
========================= */

audio.addEventListener(
    "ended",
    function(){

        nextSong();

    }
);


/* =========================
   TIME
========================= */

audio.addEventListener(
    "loadedmetadata",
    function(){

        duration.textContent =
        formatTime(audio.duration);

    }
);


audio.addEventListener(
    "timeupdate",
    function(){

        if(!audio.duration){
            return;
        }


        const percent =
        (audio.currentTime /
        audio.duration) * 100;


        progress.value =
        percent;


        currentTime.textContent =
        formatTime(audio.currentTime);

        duration.textContent =
        formatTime(audio.duration);

    }
);


/* =========================
   PROGRESS
========================= */

function seekSong(){

    if(!audio.duration){
        return;
    }


    audio.currentTime =
    (progress.value / 100)
    * audio.duration;

}


/* =========================
   VOLUME
========================= */

function changeVolume(){

    audio.volume =
    volume.value;


    if(audio.volume > 0){

        muteButton.textContent =
        "🔊";

    }
    else{

        muteButton.textContent =
        "🔇";

    }

}


/* =========================
   MUTE
========================= */

function toggleMute(){

    if(audio.volume > 0){

        oldVolume =
        audio.volume;

        audio.volume =
        0;

        volume.value =
        0;

        muteButton.textContent =
        "🔇";

    }
    else{

        audio.volume =
        oldVolume || 1;

        volume.value =
        audio.volume;

        muteButton.textContent =
        "🔊";

    }

}


/* =========================
   FORMAT TIME
========================= */

function formatTime(seconds){

    if(
        !seconds ||
        isNaN(seconds)
    ){

        return "0:00";

    }


    const minutes =
    Math.floor(seconds / 60);


    const secs =
    Math.floor(seconds % 60)
    .toString()
    .padStart(2,"0");


    return minutes + ":" + secs;

}


/* =========================
   SEARCH
========================= */

searchInput.addEventListener(
    "input",
    function(){

        const text =
        searchInput.value
        .toLowerCase()
        .trim();


        filteredSongs =
        songs.filter(song=>{

            const title =
            getTitle(song)
            .toLowerCase();

            const artist =
            getArtist(song)
            .toLowerCase();


            return (
                title.includes(text) ||
                artist.includes(text)
            );

        });


        /*
           Genre filter hem saklanýar.
        */

        if(currentGenre !== "all"){

            filteredSongs =
            filteredSongs.filter(song=>{

                return (
                    getGenre(song)
                    === currentGenre
                );

            });

        }


        renderSongs();

    }
);


/* =========================
   GENRE
========================= */

function filterGenre(
    genre,
    button
){

    currentGenre =
    genre;


    document
    .querySelectorAll(".genre")
    .forEach(btn=>{

        btn.classList.remove(
            "active"
        );

    });


    if(button){

        button.classList.add(
            "active"
        );

    }


    const search =
    searchInput.value
    .toLowerCase()
    .trim();


    filteredSongs =
    songs.filter(song=>{

        const title =
        getTitle(song)
        .toLowerCase();

        const artist =
        getArtist(song)
        .toLowerCase();


        const searchMatch =
        title.includes(search) ||
        artist.includes(search);


        const genreMatch =
        genre === "all" ||
        getGenre(song) === genre;


        return (
            searchMatch &&
            genreMatch
        );

    });


    renderSongs();

}


/* =========================
   ERROR
========================= */

audio.addEventListener(
    "error",
    function(){

        console.error(
            "MP3 açylmady:",
            audio.error
        );

        playButton.textContent =
        "▶";

    }
);


/* =========================
   START
========================= */

loadSongs();

</script>

</body>
</html>
