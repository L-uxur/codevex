<!DOCTYPE html>
<html lang="tk">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AÝDYMLY</title>

<style>
*{margin:0;padding:0;box-sizing:border-box}

body{
font-family:Arial,sans-serif;
background:#050b14;
color:white;
min-height:100vh
}

header{
height:70px;
background:#091522;
border-bottom:1px solid #1d344b;
display:flex;
align-items:center;
gap:18px;
padding:0 25px;
position:sticky;
top:0;
z-index:50
}

.logo{
color:#35e5d0;
font-size:25px;
font-weight:bold;
white-space:nowrap
}

.search{flex:1;max-width:600px}

.search input{
width:100%;
padding:13px 20px;
border-radius:25px;
border:1px solid #284159;
background:#101d2c;
color:white;
outline:none
}

.accountBtn{
border:1px solid #35e5d0;
background:#102638;
color:#35e5d0;
padding:10px 15px;
border-radius:20px;
cursor:pointer;
white-space:nowrap
}

.accountBtn:hover{
background:#35e5d0;
color:#06101b
}

main{
padding:25px;
padding-bottom:150px
}

.hero{
padding:40px;
min-height:220px;
border-radius:22px;
background:
radial-gradient(circle at 80% 20%,#155c7060,transparent 35%),
linear-gradient(135deg,#0b2740,#0d2032);
border:1px solid #203e57;
margin-bottom:30px
}

.hero h1{font-size:38px;margin-bottom:12px}
.hero p{color:#9eb2c4}

.premiumBox{
margin-top:20px;
display:inline-block;
padding:10px 15px;
border-radius:20px;
background:#14283a;
color:#35e5d0;
border:1px solid #35e5d0
}

h2{margin-bottom:15px}

.genres{
display:flex;
gap:10px;
overflow-x:auto;
margin-bottom:30px
}

.genre{
border:1px solid #25435c;
background:#0d1d2e;
color:#b7c9d9;
padding:10px 18px;
border-radius:25px;
white-space:nowrap;
cursor:pointer
}

.genre.active,
.genre:hover{
background:#35e5d0;
color:#06101b
}

.songs{
display:grid;
grid-template-columns:repeat(auto-fill,minmax(180px,1fr));
gap:20px
}

.song{
background:#0a1726;
border:1px solid #1b3349;
border-radius:17px;
padding:10px;
cursor:pointer;
transition:.25s
}

.song:hover{
transform:translateY(-5px);
border-color:#35e5d0
}

.cover{
width:100%;
aspect-ratio:1;
border-radius:13px;
object-fit:cover;
background:#14283a
}

.song h3{
margin-top:11px;
font-size:16px;
white-space:nowrap;
overflow:hidden;
text-overflow:ellipsis
}

.song p{
margin-top:5px;
color:#8ea6ba;
font-size:13px
}

.play{
width:43px;
height:43px;
border:0;
border-radius:50%;
background:#35e5d0;
color:#06101b;
font-size:18px;
cursor:pointer;
margin-top:10px
}

.download{
margin-top:8px;
width:100%;
padding:9px;
border-radius:10px;
border:1px solid #35e5d0;
background:#102638;
color:#35e5d0;
cursor:pointer
}

.download:hover{
background:#35e5d0;
color:#06101b
}

.empty{
color:#8fa6ba;
padding:25px 0
}

/* PLAYER */

.player{
position:fixed;
left:0;
right:0;
bottom:0;
height:100px;
background:#091522f5;
backdrop-filter:blur(15px);
border-top:1px solid #29435a;
display:flex;
align-items:center;
gap:14px;
padding:10px 20px;
z-index:100
}

.playerCover{
width:65px;
height:65px;
border-radius:10px;
object-fit:cover;
background:#14283a
}

.info{
width:180px;
min-width:100px
}

.title{
font-weight:bold;
white-space:nowrap;
overflow:hidden;
text-overflow:ellipsis
}

.artist{
color:#8da5b9;
font-size:13px;
margin-top:5px
}

.controls{
display:flex;
align-items:center;
gap:8px
}

.btn{
width:40px;
height:40px;
border-radius:50%;
border:0;
background:#14283a;
color:white;
cursor:pointer;
font-size:16px
}

.mainBtn{
background:#35e5d0;
color:#06101b
}

.progressBox{
flex:1;
display:flex;
align-items:center;
gap:8px
}

.progress{
width:100%;
accent-color:#35e5d0
}

.time{
color:#8da5b9;
font-size:11px;
white-space:nowrap
}

.volume{
width:90px;
accent-color:#35e5d0
}

/* AUTH */

.modal{
display:none;
position:fixed;
inset:0;
background:#000c;
backdrop-filter:blur(10px);
z-index:500;
align-items:center;
justify-content:center;
padding:20px
}

.authBox{
width:100%;
max-width:400px;
background:#091522;
border:1px solid #35e5d0;
border-radius:20px;
padding:25px;
box-shadow:0 20px 60px #000
}

.authBox h2{
color:#35e5d0;
margin-bottom:20px
}

.authBox input{
width:100%;
padding:13px;
margin-bottom:12px;
border-radius:10px;
border:1px solid #284159;
background:#101d2c;
color:white;
outline:none
}

.authMain{
width:100%;
padding:13px;
border:0;
border-radius:10px;
background:#35e5d0;
color:#06101b;
font-weight:bold;
cursor:pointer
}

.authSwitch{
width:100%;
margin-top:10px;
padding:11px;
border:1px solid #29435a;
border-radius:10px;
background:#102638;
color:white;
cursor:pointer
}

.closeBtn{
float:right;
border:0;
background:none;
color:#9eb2c4;
font-size:24px;
cursor:pointer
}

.authMessage{
margin-top:12px;
color:#9eb2c4;
font-size:13px;
line-height:1.5
}

/* ACCOUNT */

.profileMenu{
display:none;
position:fixed;
top:75px;
right:20px;
width:260px;
background:#091522;
border:1px solid #29435a;
border-radius:15px;
padding:18px;
z-index:200
}

.profileMenu p{
color:#9eb2c4;
font-size:13px;
margin-bottom:10px;
word-break:break-all
}

.premiumStatus{
padding:10px;
border-radius:10px;
background:#102638;
color:#35e5d0;
margin-bottom:12px
}

.logout{
width:100%;
padding:10px;
border:1px solid #7b3340;
border-radius:10px;
background:#27151b;
color:#ff8090;
cursor:pointer
}

/* MOBILE */

@media(max-width:700px){

header{
padding:0 10px;
gap:8px
}

.logo{font-size:18px}

.search{max-width:none}

.search input{
padding:11px 13px
}

.accountBtn{
padding:9px 10px;
font-size:12px
}

main{
padding:15px;
padding-bottom:145px
}

.hero{
padding:25px
}

.hero h1{font-size:28px}

.songs{
grid-template-columns:repeat(2,1fr);
gap:12px
}

.song{padding:8px}

.player{
height:105px;
padding:8px 10px;
gap:7px
}

.playerCover{
width:48px;
height:48px
}

.info{
width:95px;
min-width:75px
}

.btn{
width:35px;
height:35px
}

.volume{display:none}

.progressBox{
position:absolute;
left:10px;
right:10px;
bottom:4px
}

.profileMenu{
right:10px;
top:70px
}
}
</style>
</head>

<body>

<header>

<div class="logo">AÝDYMLY</div>

<div class="search">
<input
id="search"
type="text"
placeholder="Aýdym ýa-da aýdymçy gözle..."
>
</div>

<button
id="accountBtn"
class="accountBtn"
onclick="openAccount()">
Giriş / Hasap
</button>

</header>

<main>

<section class="hero">

<h1>Aýdymyňy saýla 🎵</h1>

<p>
Halaýan aýdymlaryňy gözle, saýla we göni Aýdymly-da diňle.
</p>

<div id="premiumBox" class="premiumBox">
Free
</div>

</section>

<h2>Žanrlar</h2>

<div class="genres">

<button class="genre active"
onclick="filterGenre('all',this)">
Hemmesi
</button>

<button class="genre"
onclick="filterGenre('pop',this)">
Pop
</button>

<button class="genre"
onclick="filterGenre('rap',this)">
Rap
</button>

<button class="genre"
onclick="filterGenre('phonk',this)">
Phonk
</button>

<button class="genre"
onclick="filterGenre('funk',this)">
Funk
</button>

<button class="genre"
onclick="filterGenre('turkmen',this)">
Türkmen
</button>

</div>

<h2>Aýdymlar</h2>

<div id="songs" class="songs">
<div class="empty">Aýdymlar ýüklenýär...</div>
</div>

</main>

<!-- PLAYER -->

<div class="player">

<img id="playerCover"
class="playerCover"
alt="Cover">

<div class="info">

<div id="playerTitle" class="title">
Aýdym saýla
</div>

<div id="playerArtist" class="artist">
—
</div>

</div>

<div class="controls">

<button class="btn"
onclick="previousSong()">⏮</button>

<button id="playButton"
class="btn mainBtn"
onclick="togglePlay()">▶</button>

<button class="btn"
onclick="nextSong()">⏭</button>

</div>

<div class="progressBox">

<span id="currentTime" class="time">0:00</span>

<input
id="progress"
class="progress"
type="range"
min="0"
max="100"
value="0"
step="0.1">

<span id="duration" class="time">0:00</span>

</div>

<input
id="volume"
class="volume"
type="range"
min="0"
max="1"
step="0.01"
value="1">

</div>

<audio id="audio" preload="metadata"></audio>

<!-- AUTH -->

<div id="authModal" class="modal">

<div class="authBox">

<button class="closeBtn"
onclick="closeAuth()">×</button>

<h2 id="authTitle">Hasap aç</h2>

<input
id="authEmail"
type="email"
placeholder="Email">

<input
id="authPassword"
type="password"
placeholder="Parol">

<button
id="authMainButton"
class="authMain"
onclick="authAction()">
Hasap aç
</button>

<button
id="authSwitch"
class="authSwitch"
onclick="switchAuthMode()">
Girişe geç
</button>

<div id="authMessage"
class="authMessage">
</div>

</div>
</div>

<!-- PROFILE -->

<div id="profileMenu" class="profileMenu">

<p id="profileEmail">—</p>

<div id="profilePremium"
class="premiumStatus">
Free
</div>

<button class="logout"
onclick="logout()">
Çykmak
</button>

</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<script>

/* =========================
SUPABASE
========================= */

const SUPABASE_URL =
"https://ievywgyevceodiwgymce.supabase.co";

const SUPABASE_KEY =
"sb_publishable_1OBoq4TVdWJI040pwEaY_Q_MzMHMda0";

const db =
supabase.createClient(
SUPABASE_URL,
SUPABASE_KEY
);

/* =========================
DÜNÝÄ
========================= */

const DUNYA_AUDIO =
"https://ievywgyevceodiwgymce.supabase.co/storage/v1/object/public/songs/Dunya.mp3";

const DUNYA_COVER =
"https://ievywgyevceodiwgymce.supabase.co/storage/v1/object/public/songs/Dunya.jpg";

/* =========================
ELEMENTS
========================= */

const audio =
document.getElementById("audio");

const songsBox =
document.getElementById("songs");

const search =
document.getElementById("search");

const playerCover =
document.getElementById("playerCover");

const playerTitle =
document.getElementById("playerTitle");

const playerArtist =
document.getElementById("playerArtist");

const playButton =
document.getElementById("playButton");

const progress =
document.getElementById("progress");

const currentTime =
document.getElementById("currentTime");

const duration =
document.getElementById("duration");

const volume =
document.getElementById("volume");

const accountBtn =
document.getElementById("accountBtn");

const authModal =
document.getElementById("authModal");

const authTitle =
document.getElementById("authTitle");

const authMainButton =
document.getElementById("authMainButton");

const authSwitch =
document.getElementById("authSwitch");

const authEmail =
document.getElementById("authEmail");

const authPassword =
document.getElementById("authPassword");

const authMessage =
document.getElementById("authMessage");

const profileMenu =
document.getElementById("profileMenu");

const profileEmail =
document.getElementById("profileEmail");

const profilePremium =
document.getElementById("profilePremium");

const premiumBox =
document.getElementById("premiumBox");

/* =========================
VARIABLES
========================= */

let songs = [];
let filteredSongs = [];

let currentIndex = -1;

let authMode = "register";

let currentUser = null;
let currentProfile = null;

/* Aýdymy basyp, login garaşýan bolsa */
let pendingSongIndex = -1;

/* =========================
ACCOUNT
========================= */

function openAccount(){

if(currentUser){

profileMenu.style.display =
profileMenu.style.display === "block"
? "none"
: "block";

return;

}

authMode = "register";

authTitle.textContent = "Hasap aç";
authMainButton.textContent = "Hasap aç";
authSwitch.textContent = "Girişe geç";

authModal.style.display = "flex";

}

/* =========================
AUTH CLOSE
========================= */

function closeAuth(){

authModal.style.display = "none";

authMessage.textContent = "";

}

/* =========================
SWITCH LOGIN / REGISTER
========================= */

function switchAuthMode(){

if(authMode === "register"){

authMode = "login";

authTitle.textContent = "Giriş";

authMainButton.textContent = "Giriş";

authSwitch.textContent = "Hasap aç";

}
else{

authMode = "register";

authTitle.textContent = "Hasap aç";

authMainButton.textContent = "Hasap aç";

authSwitch.textContent = "Girişe geç";

}

authMessage.textContent = "";

}

/* =========================
REGISTER / LOGIN
========================= */

async function authAction(){

const email =
authEmail.value.trim();

const password =
authPassword.value;

if(!email || !password){

authMessage.textContent =
"Email we paroly doldur.";

return;

}

if(password.length < 6){

authMessage.textContent =
"Parol azyndan 6 simwol bolmaly.";

return;

}

authMessage.textContent =
"Garaşylýar...";

try{

if(authMode === "register"){

const result =
await db.auth.signUp({
email:email,
password:password
});

if(result.error){

authMessage.textContent =
result.error.message;

return;

}

/*
Email confirmation açyk bolsa
session null bolup biler.
*/

if(result.data.session){

currentUser =
result.data.user;

await loadProfile();

closeAuth();

playPendingSong();

}
else{

authMessage.textContent =
"Hasap döredildi. Emailiňe gelen tassyklama hatyny barla.";

}

}
else{

const result =
await db.auth.signInWithPassword({
email:email,
password:password
});

if(result.error){

authMessage.textContent =
result.error.message;

return;

}

currentUser =
result.data.user;

await loadProfile();

closeAuth();

playPendingSong();

}

}
catch(error){

console.error(error);

authMessage.textContent =
"Bir näsazlyk boldy. Täzeden synanş.";

}

}

/* =========================
PENDING SONG
========================= */

function playPendingSong(){

if(pendingSongIndex < 0){

return;

}

const index =
pendingSongIndex;

pendingSongIndex = -1;

setTimeout(function(){

selectSong(index);

},200);

}

/* =========================
PROFILE
========================= */

async function loadProfile(){

if(!currentUser){

return;

}

const result =
await db
.from("profiles")
.select("*")
.eq("id",currentUser.id)
.maybeSingle();

if(result.error){

console.error(
"Profile error:",
result.error
);

return;

}

if(!result.data){

console.log(
"Profile tapylmady."
);

return;

}

currentProfile =
result.data;

await checkPremiumExpiry();

updateAccountUI();

renderSongs();

}

/* =========================
PREMIUM EXPIRY
========================= */

async function checkPremiumExpiry(){

if(!currentProfile){

return;

}

if(
currentProfile.premium &&
currentProfile.premium_until
){

const until =
new Date(
currentProfile.premium_until
);

const now =
new Date();

if(now >= until){

await db
.from("profiles")
.update({
premium:false,
premium_until:null
})
.eq("id",currentUser.id);

currentProfile.premium = false;

currentProfile.premium_until = null;

}

}

}

/* =========================
ACCOUNT UI
========================= */

function updateAccountUI(){

if(!currentUser){

accountBtn.textContent =
"Giriş / Hasap";

premiumBox.textContent =
"Free";

return;

}

accountBtn.textContent =
"👤 Hasabym";

profileEmail.textContent =
currentUser.email || "Email ýok";

if(
currentProfile &&
currentProfile.premium
){

profilePremium.textContent =
"⭐ PREMIUM";

premiumBox.textContent =
"⭐ PREMIUM";

}
else{

profilePremium.textContent =
"Free";

premiumBox.textContent =
"Free";

}

}

/* =========================
LOGOUT
========================= */

async function logout(){

await db.auth.signOut();

currentUser = null;

currentProfile = null;

profileMenu.style.display = "none";

updateAccountUI();

renderSongs();

}

/* =========================
AUTH STATE
========================= */

db.auth.onAuthStateChange(
async function(event,session){

if(session){

currentUser =
session.user;

await loadProfile();

}
else{

currentUser = null;

currentProfile = null;

updateAccountUI();

renderSongs();

}

});

/* =========================
SONGS
========================= */

async function loadSongs(){

const result =
await db
.from("Songs")
.select("*")
.order("id",{ascending:true});

if(result.error){

console.error(result.error);

songsBox.innerHTML =
`
<div class="empty">
Aýdymlary ýüklemekde ýalňyşlyk boldy.
</div>
`;

return;

}

songs =
result.data || [];

songs =
songs.map(function(song){

if(
song.title === "Dünýä" ||
song.başlık === "Dünýä"
){

song.ses_url =
DUNYA_AUDIO;

song.kapak_url =
song.kapak_url ||
DUNYA_COVER;

}

return song;

});

filteredSongs =
[...songs];

renderSongs();

}

/* =========================
HELPERS
========================= */

function titleOf(song){

return song.title ||
song.başlık ||
"Dünýä";

}

function artistOf(song){

return song.artist ||
song.sanatçy ||
song.sanatçı ||
"Hemra Rejepow";

}

function audioOf(song){

if(
song.ses_url &&
song.ses_url.trim() !== ""
){

return song.ses_url;

}

if(
song.audio_url &&
song.audio_url.trim() !== ""
){

return song.audio_url;

}

if(
titleOf(song) === "Dünýä"
){

return DUNYA_AUDIO;

}

return "";

}

function coverOf(song){

if(
song.kapak_url &&
song.kapak_url.trim() !== ""
){

return song.kapak_url;

}

if(
song.cover_url &&
song.cover_url.trim() !== ""
){

return song.cover_url;

}

if(
titleOf(song) === "Dünýä"
){

return DUNYA_COVER;

}

return "";

}

/* =========================
RENDER
========================= */

function renderSongs(){

songsBox.innerHTML = "";

if(filteredSongs.length === 0){

songsBox.innerHTML =
`
<div class="empty">
Aýdym tapylmady.
</div>
`;

return;

}

filteredSongs.forEach(function(song){

const index =
songs.indexOf(song);

const card =
document.createElement("div");

card.className = "song";

const cover =
document.createElement("img");

cover.className = "cover";

cover.src =
coverOf(song);

cover.alt =
titleOf(song);

const title =
document.createElement("h3");

title.textContent =
titleOf(song);

const artist =
document.createElement("p");

artist.textContent =
artistOf(song);

const button =
document.createElement("button");

button.className = "play";

button.textContent = "▶";

button.onclick =
function(e){

e.stopPropagation();

selectSong(index);

};

card.onclick =
function(){

selectSong(index);

};

card.appendChild(cover);

card.appendChild(title);

card.appendChild(artist);

card.appendChild(button);

/*
Premium download
*/

if(
currentProfile &&
currentProfile.premium
){

const download =
document.createElement("button");

download.className =
"download";

download.textContent =
"📥 Telefona ýüklä";

download.onclick =
function(e){

e.stopPropagation();

downloadSong(song);

};

card.appendChild(download);

}

songsBox.appendChild(card);

});

}

/* =========================
DOWNLOAD
========================= */

function downloadSong(song){

if(
!currentProfile ||
!currentProfile.premium
){

alert(
"Download diňe Premium üçin."
);

return;

}

const url =
audioOf(song);

if(!url){

alert(
"Audio URL tapylmady."
);

return;

}

const a =
document.createElement("a");

a.href = url;

a.download =
titleOf(song) + ".mp3";

a.target = "_blank";

document.body.appendChild(a);

a.click();

a.remove();

}

/* =========================
SELECT SONG
========================= */

function selectSong(index){

/*
Iň möhüm ýer:
Login ýok bolsa aýdym çalmaýar.
Giriş/Hasap aç penjiresini açýar.
*/

if(!currentUser){

pendingSongIndex = index;

authMode = "register";

authTitle.textContent =
"Hasap aç";

authMainButton.textContent =
"Hasap aç";

authSwitch.textContent =
"Girişe geç";

authMessage.textContent =
"Aýdym diňlemek üçin ilki hasap aç.";

authModal.style.display = "flex";

return;

}

const song =
songs[index];

if(!song){

return;

}

currentIndex =
index;

playerTitle.textContent =
titleOf(song);

playerArtist.textContent =
artistOf(song);

const cover =
coverOf(song);

const mp3 =
audioOf(song);

if(cover){

playerCover.src =
cover;

}

if(!mp3){

alert(
"Aýdymyň MP3 URL-si tapylmady."
);

return;

}

audio.pause();

audio.removeAttribute("src");

audio.load();

audio.src = mp3;

audio.load();

audio.play()
.then(function(){

playButton.textContent = "⏸";

})
.catch(function(error){

console.error(error);

playButton.textContent = "▶";

});

}

/* =========================
PLAY
========================= */

function togglePlay(){

if(!currentUser){

authMode = "register";

authTitle.textContent =
"Hasap aç";

authMainButton.textContent =
"Hasap aç";

authSwitch.textContent =
"Girişe geç";

authMessage.textContent =
"Aýdym diňlemek üçin ilki hasap aç.";

authModal.style.display =
"flex";

return;

}

if(!audio.src){

if(songs.length){

selectSong(
currentIndex >= 0
? currentIndex
: 0
);

}

return;

}

if(audio.paused){

audio.play();

}
else{

audio.pause();

}

}

/* =========================
NEXT
========================= */

function nextSong(){

if(!currentUser){

return;

}

if(!songs.length){

return;

}

let next =
currentIndex + 1;

if(next >= songs.length){

next = 0;

}

selectSong(next);

}

/* =========================
PREVIOUS
========================= */

function previousSong(){

if(!currentUser){

return;

}

if(!songs.length){

return;

}

let previous =
currentIndex - 1;

if(previous < 0){

previous =
songs.length - 1;

}

selectSong(previous);

}

audio.addEventListener(
"ended",
nextSong
);

/* =========================
AUDIO EVENTS
========================= */

audio.addEventListener(
"loadedmetadata",
function(){

duration.textContent =
formatTime(audio.duration);

});

audio.addEventListener(
"timeupdate",
function(){

if(!audio.duration){

return;

}

progress.value =
(audio.currentTime /
audio.duration) * 100;

currentTime.textContent =
formatTime(
audio.currentTime
);

duration.textContent =
formatTime(
audio.duration
);

});

audio.addEventListener(
"play",
function(){

playButton.textContent =
"⏸";

});

audio.addEventListener(
"pause",
function(){

playButton.textContent =
"▶";

});

progress.addEventListener(
"input",
function(){

if(!audio.duration){

return;

}

audio.currentTime =
(progress.value / 100) *
audio.duration;

});

volume.addEventListener(
"input",
function(){

audio.volume =
volume.value;

});

/* =========================
SEARCH
========================= */

search.addEventListener(
"input",
function(){

const text =
search.value
.toLowerCase()
.trim();

filteredSongs =
songs.filter(function(song){

return(
titleOf(song)
.toLowerCase()
.includes(text) ||

artistOf(song)
.toLowerCase()
.includes(text)
);

});

renderSongs();

});

/* =========================
GENRE
========================= */

function filterGenre(
genre,
button
){

document
.querySelectorAll(".genre")
.forEach(function(btn){

btn.classList.remove("active");

});

button.classList.add("active");

if(genre === "all"){

filteredSongs =
[...songs];

}
else{

filteredSongs =
songs.filter(function(song){

return(
song.genre || ""
)
.toLowerCase() === genre;

});

}

renderSongs();

}

/* =========================
TIME
========================= */

function formatTime(seconds){

if(
!seconds ||
isNaN(seconds)
){

return "0:00";

}

const min =
Math.floor(seconds / 60);

const sec =
Math.floor(seconds % 60)
.toString()
.padStart(2,"0");

return min + ":" + sec;

}
