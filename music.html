<!DOCTYPE html>
<html lang="tk">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>AÝDYMLY — Music</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>
*{box-sizing:border-box;margin:0;padding:0}

body{
    font-family:Arial,sans-serif;
    background:#050914;
    color:#fff;
    min-height:100vh;
}

button,input{font-family:inherit}

.app{display:flex;min-height:100vh}

/* SIDEBAR */
.sidebar{
    width:230px;
    position:fixed;
    top:0;
    bottom:0;
    left:0;
    background:#070d19;
    border-right:1px solid #17253b;
    padding:25px 15px;
}

.logo{
    display:flex;
    align-items:center;
    gap:11px;
    margin-bottom:45px;
    padding-left:8px;
}

.logoIcon{
    width:44px;
    height:44px;
    border:2px solid #1594ff;
    border-radius:13px;
    display:flex;
    align-items:center;
    justify-content:center;
    color:#52b8ff;
    font-size:24px;
    font-weight:bold;
    box-shadow:0 0 25px #0879d633;
}

.logoText{
    font-size:20px;
    font-weight:800;
}

.logoText span{color:#42adff}

.nav{
    display:flex;
    flex-direction:column;
    gap:8px;
}

.nav button{
    border:0;
    background:transparent;
    color:#8998af;
    padding:14px;
    border-radius:12px;
    text-align:left;
    cursor:pointer;
    font-size:14px;
}

.nav button:hover,
.nav button.active{
    color:white;
    background:#126fd91f;
}

.icon{
    display:inline-block;
    width:28px;
    font-size:18px;
}

.bottomText{
    position:absolute;
    left:15px;
    right:15px;
    bottom:25px;
    color:#61728c;
    font-size:11px;
}

/* MAIN */
.main{
    margin-left:230px;
    width:calc(100% - 230px);
    padding:25px 28px 120px;
}

.topbar{
    display:flex;
    gap:15px;
    margin-bottom:25px;
}

.search{
    flex:1;
    position:relative;
}

.search input{
    width:100%;
    padding:16px 18px 16px 48px;
    background:#0b1627;
    color:#fff;
    border:1px solid #172b47;
    border-radius:15px;
    outline:none;
}

.search input:focus{
    border-color:#168cff;
}

.searchIcon{
    position:absolute;
    left:17px;
    top:13px;
    font-size:21px;
    color:#8395ae;
}

.topBtn{
    width:46px;
    height:46px;
    border-radius:50%;
    border:1px solid #172b47;
    background:#0b1627;
    color:#fff;
}

/* HERO */
.hero{
    height:260px;
    border:1px solid #18304f;
    border-radius:23px;
    padding:40px;
    display:flex;
    align-items:center;
    position:relative;
    overflow:hidden;
    background:
      radial-gradient(circle at 80% 50%,#0876c955,transparent 35%),
      linear-gradient(100deg,#07101d,#0b1b31);
}

.hero:after{
    content:"♫";
    position:absolute;
    right:100px;
    top:25px;
    font-size:190px;
    color:#168cff18;
}

.heroText{position:relative;z-index:2}

.hero small{
    color:#46b3ff;
    font-weight:bold;
}

.hero h1{
    font-size:44px;
    margin:12px 0;
    line-height:1;
}

.hero h1 span{color:#ff915c}

.hero p{color:#899ab3}

/* GENRES */
.genres{
    display:flex;
    gap:9px;
    overflow-x:auto;
    padding:20px 0;
}

.genre{
    white-space:nowrap;
    padding:10px 18px;
    border-radius:30px;
    background:#0a1729;
    border:1px solid #182d49;
    color:#91a0b8;
    cursor:pointer;
}

.genre:hover,
.genre.active{
    background:#168cff;
    color:#fff;
}

/* SECTION */
.sectionHeader{
    display:flex;
    justify-content:space-between;
    margin:10px 0 17px;
}

.sectionHeader h2{font-size:21px}

.sectionHeader span{
    color:#43adff;
    font-size:13px;
}

/* SONGS */
.songGrid{
    display:grid;
    grid-template-columns:repeat(auto-fill,minmax(165px,1fr));
    gap:17px;
}

.song{
    background:#0a1627;
    border:1px solid #172b47;
    border-radius:16px;
    padding:10px;
    cursor:pointer;
    transition:.25s;
}

.song:hover{
    transform:translateY(-5px);
    border-color:#168cff88;
    box-shadow:0 15px 35px #006eff18;
}

.cover{
    width:100%;
    aspect-ratio:1;
    object-fit:cover;
    border-radius:11px;
    background:#101e32;
}

.songInfo{
    display:flex;
    justify-content:space-between;
    align-items:center;
    margin-top:10px;
}

.songTitle{
    font-weight:bold;
    font-size:14px;
    white-space:nowrap;
    overflow:hidden;
    text-overflow:ellipsis;
}

.songArtist{
    color:#7e8fa9;
    font-size:12px;
    margin-top:5px;
    white-space:nowrap;
    overflow:hidden;
    text-overflow:ellipsis;
}

.miniPlay{
    width:32px;
    height:32px;
    border:0;
    border-radius:50%;
    background:#168cff;
    color:white;
    cursor:pointer;
}

/* PLAYER */
.player{
    position:fixed;
    left:230px;
    right:0;
    bottom:0;
    height:90px;
    background:#060d18ee;
    backdrop-filter:blur(18px);
    border-top:1px solid #172b47;
    display:flex;
    align-items:center;
    gap:20px;
    padding:12px 25px;
    z-index:20;
}

.now{
    width:240px;
    display:flex;
    align-items:center;
    gap:12px;
}

.now img{
    width:58px;
    height:58px;
    object-fit:cover;
    border-radius:9px;
}

.nowTitle{font-size:13px;font-weight:bold}
.nowArtist{font-size:11px;color:#7889a2;margin-top:4px}

.controls{
    display:flex;
    align-items:center;
    gap:15px;
}

.control{
    border:0;
    background:none;
    color:#c4d0e2;
    font-size:18px;
    cursor:pointer;
}

.play{
    width:46px;
    height:46px;
    border-radius:50%;
    border:0;
    background:#168cff;
    color:white;
    font-size:18px;
    cursor:pointer;
}

.progress{
    flex:1;
    height:4px;
    border-radius:10px;
    background:#1b2b42;
}

.progress div{
    width:35%;
    height:100%;
    background:#168cff;
    border-radius:10px;
}

.empty{
    grid-column:1/-1;
    text-align:center;
    padding:50px;
    border:1px dashed #1a304d;
    border-radius:15px;
    color:#71829c;
}

/* MOBILE */
@media(max-width:800px){

    .sidebar{
        width:68px;
        padding:20px 7px;
    }

    .logoText,
    .nav button span:not(.icon),
    .bottomText{
        display:none;
    }

    .logo{
        justify-content:center;
        padding:0;
    }

    .main{
        margin-left:68px;
        width:calc(100% - 68px);
        padding:17px 12px 110px;
    }

    .hero{
        height:210px;
        padding:25px;
    }

    .hero h1{font-size:31px}

    .player{
        left:68px;
        height:80px;
        padding:9px;
    }

    .now{
        flex:1;
        width:auto;
    }

    .progress{display:none}

    .songGrid{
        grid-template-columns:repeat(2,1fr);
    }
}
</style>
</head>

<body>

<div class="app">

<aside class="sidebar">

    <div class="logo">
        <div class="logoIcon">A</div>
        <div class="logoText">AÝ<span>DYMLY</span></div>
    </div>

    <div class="nav">

        <button class="active">
            <span class="icon">⌂</span>
            <span>Baş sahypa</span>
        </button>

        <button>
            <span class="icon">♫</span>
            <span>Aýdymlar</span>
        </button>

        <button>
            <span class="icon">♬</span>
            <span>Playlist</span>
        </button>

        <button>
            <span class="icon">♡</span>
            <span>Halanlar</span>
        </button>

        <button>
            <span class="icon">⌕</span>
            <span>Gözleg</span>
        </button>

    </div>

    <div class="bottomText">
        <b>AÝDYMLY</b><br>
        Music connects people.
    </div>

</aside>


<main class="main">

    <div class="topbar">

        <div class="search">
            <span class="searchIcon">⌕</span>
            <input
                id="searchInput"
                placeholder="Aýdym, artist ýa-da genre gözle..."
            >
        </div>

        <button class="topBtn">☾</button>
        <button class="topBtn">◉</button>

    </div>


    <section class="hero">

        <div class="heroText">

            <small>AÝDYMLY MUSIC</small>

            <h1>
                Good Music<br>
                <span>Better Days</span>
            </h1>

            <p>Aýdymlar ruhyňy bezeýär...</p>

        </div>

    </section>


    <div class="genres">

        <button class="genre active" data-genre="all">Ähli</button>
        <button class="genre" data-genre="Pop">Pop</button>
        <button class="genre" data-genre="Rap">Rap</button>
        <button class="genre" data-genre="Hip-Hop">Hip-Hop</button>
        <button class="genre" data-genre="Phonk">Phonk</button>
        <button class="genre" data-genre="Funk">Funk</button>
        <button class="genre" data-genre="Rock">Rock</button>
        <button class="genre" data-genre="Electronic">Electronic</button>
        <button class="genre" data-genre="Turkmen">Türkmen</button>
        <button class="genre" data-genre="Turkish">Türk</button>

    </div>


    <section>

        <div class="sectionHeader">

            <h2>🔥 Meşhur aýdymlar</h2>

            <span>Ähmesini görmek →</span>

        </div>

        <div id="songGrid" class="songGrid">
            <div class="empty">Aýdymlar ýüklenýär...</div>
        </div>

    </section>

</main>

</div>


<div class="player">

    <div class="now">

        <img id="nowCover"
        src="https://images.unsplash.com/photo-1511379938547-c1f69419868d?auto=format&fit=crop&w=400&q=80">

        <div>

            <div id="nowTitle" class="nowTitle">
                Aýdym saýla
            </div>

            <div id="nowArtist" class="nowArtist">
                AÝDYMLY
            </div>

        </div>

    </div>


    <div class="controls">

        <button class="control">↶</button>

        <button class="control">◀</button>

        <button id="playButton" class="play">▶</button>

        <button class="control">▶</button>

        <button class="control">↷</button>

    </div>


    <div class="progress">
        <div></div>
    </div>

</div>


<script>

/* ================================
   SUPABASE
================================ */

const SUPABASE_URL =
"https://ievywgyevceodiwgymce.supabase.co";

const SUPABASE_KEY =
"sb_publishable_1OBoq4TVdWJI040pwEaY_Q_MzMHMda0";


const db =
supabase.createClient(
    SUPABASE_URL,
    SUPABASE_KEY
);


/* ================================
   VARIABLES
================================ */

const songGrid =
document.getElementById("songGrid");

const searchInput =
document.getElementById("searchInput");

const nowTitle =
document.getElementById("nowTitle");

const nowArtist =
document.getElementById("nowArtist");

const nowCover =
document.getElementById("nowCover");

const playButton =
document.getElementById("playButton");


const defaultCover =
"https://images.unsplash.com/photo-1511379938547-c1f69419868d?auto=format&fit=crop&w=600&q=80";


let songs = [];
let currentSong = null;


/* ================================
   LOAD SONGS
================================ */

async function loadSongs(){

    try{

        const {data,error} =
        await db
        .from("Songs")
        .select("*")
        .order("id",{ascending:false});


        if(error){

            console.error(error);

            songGrid.innerHTML =
            `<div class="empty">
                Songs tablisasyny okap bolmady.
            </div>`;

            return;
        }


        songs = data || [];

        renderSongs(songs);

    }

    catch(error){

        console.error(error);

        songGrid.innerHTML =
        `<div class="empty">
            Baglanyşyk ýalňyşlygy boldy.
        </div>`;

    }

}


/* ================================
   RENDER
================================ */

function renderSongs(list){

    if(!list.length){

        songGrid.innerHTML =
        `<div class="empty">
            Aýdym tapylmady.
        </div>`;

        return;
    }


    songGrid.innerHTML = "";


    list.forEach(song => {

        const card =
        document.createElement("div");

        card.className = "song";


        const title =
        song.title ||
        song.başlık ||
        "Adsız aýdym";


        const artist =
        song.artist ||
        song.sanatçı ||
        "Näbelli artist";


        const cover =
        song.cover_url ||
        song.cover ||
        defaultCover;


        card.innerHTML = `

            <img
                class="cover"
                src="${cover}"
                onerror="this.src='${defaultCover}'"
            >

            <div class="songInfo">

                <div style="min-width:0">

                    <div class="songTitle">
                        ${safe(title)}
                    </div>

                    <div class="songArtist">
                        ${safe(artist)}
                    </div>

                </div>

                <button class="miniPlay">
                    ▶
                </button>

            </div>

        `;


        card.addEventListener(
            "click",
            () => selectSong(song)
        );


        songGrid.appendChild(card);

    });

}


/* ================================
   SELECT
================================ */

function selectSong(song){

    currentSong = song;


    const title =
    song.title ||
    song.başlık ||
    "Adsız aýdym";


    const artist =
    song.artist ||
    song.sanatçı ||
    "Näbelli artist";


    const cover =
    song.cover_url ||
    song.cover ||
    defaultCover;


    nowTitle.textContent = title;
    nowArtist.textContent = artist;
    nowCover.src = cover;


    openSong(song);

}


/* ================================
   SPOTIFY / SOUNDCLOUD
================================ */

function openSong(song){

    const soundcloud =
    song.soundcloud_url;

    const spotify =
    song.spotify_url;


    if(soundcloud){

        window.open(
            soundcloud,
            "_blank"
        );

        return;
    }


    if(spotify){

        window.open(
            spotify,
            "_blank"
        );

        return;
    }


    alert(
        "Bu aýdym üçin link ýok."
    );

}


/* ================================
   SEARCH
================================ */

searchInput.addEventListener(
"input",
function(){

    const value =
    this.value.toLowerCase().trim();


    const filtered =
    songs.filter(song => {

        const title =
        String(
            song.title ||
            song.başlık ||
            ""
        ).toLowerCase();


        const artist =
        String(
            song.artist ||
            song.sanatçı ||
            ""
        ).toLowerCase();


        const genre =
        String(
            song.genre ||
            ""
        ).toLowerCase();


        return (
            title.includes(value) ||
            artist.includes(value) ||
            genre.includes(value)
        );

    });


    renderSongs(filtered);

});


/* ================================
   GENRE
================================ */

document
.querySelectorAll(".genre")
.forEach(button => {

    button.addEventListener(
    "click",
    function(){

        document
        .querySelectorAll(".genre")
        .forEach(x =>
            x.classList.remove("active")
        );


        this.classList.add("active");


        const genre =
        this.dataset.genre;


        if(genre === "all"){

            renderSongs(songs);

            return;
        }


        const filtered =
        songs.filter(song => {

            const g =
            String(
                song.genre || ""
            ).toLowerCase();


            return (
                g === genre.toLowerCase()
            );

        });


        renderSongs(filtered);

    });

});


/* ================================
   PLAYER
================================ */

playButton.addEventListener(
"click",
function(){

    if(!currentSong){

        if(songs.length){
            selectSong(songs[0]);
        }

        return;
    }


    openSong(currentSong);

});


/* ================================
   SECURITY
================================ */

function safe(text){

    return String(text)
    .replace(/&/g,"&amp;")
    .replace(/</g,"&lt;")
    .replace(/>/g,"&gt;")
    .replace(/"/g,"&quot;")
    .replace(/'/g,"&#039;");

}


/* ================================
   START
================================ */

loadSongs();

</script>

</body>
</html>
